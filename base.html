<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #13161e;
            --card: #181c26;
            --border: #252a38;
            --gold: #c9a84c;
            --gold-light: #e8c96b;
            --text: #e8e4da;
            --text-muted: #7a7d8a;
            --green: #4caf7d;
            --red: #e05c5c;
            --blue: #5c8fe0;
            --purple: #8b5ce0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 28px 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-brand .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .sidebar-brand .tagline {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-section {
            padding: 20px 12px 8px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .nav-link:hover {
            background: var(--card);
            color: var(--text);
        }

        .nav-link.active {
            background: rgba(201, 168, 76, 0.12);
            color: var(--gold);
            font-weight: 500;
        }

        .nav-link .icon {
            width: 18px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 12px;
            border-top: 1px solid var(--border);
        }

        /* ── MAIN ── */
        .main {
            margin-left: 240px;
            flex: 1;
            min-height: 100vh;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .content {
            padding: 32px;
        }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gold);
            opacity: 0.6;
        }

        .stat-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── TABLE ── */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .table-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .table-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 12px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 14px 20px;
            font-size: 14px;
            color: var(--text);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover td {
            background: rgba(201, 168, 76, 0.04);
        }

        /* ── BADGES ── */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green { background: rgba(76,175,125,0.15); color: var(--green); border: 1px solid rgba(76,175,125,0.3); }
        .badge-red   { background: rgba(224,92,92,0.15);  color: var(--red);   border: 1px solid rgba(224,92,92,0.3); }
        .badge-blue  { background: rgba(92,143,224,0.15); color: var(--blue);  border: 1px solid rgba(92,143,224,0.3); }
        .badge-gold  { background: rgba(201,168,76,0.15); color: var(--gold);  border: 1px solid rgba(201,168,76,0.3); }
        .badge-muted { background: rgba(122,125,138,0.15); color: var(--text-muted); border: 1px solid rgba(122,125,138,0.3); }

        /* ── SEARCH / FILTER BAR ── */
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
        }

        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            width: 200px;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(201, 168, 76, 0.12);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        /* ── TWO COL LAYOUT ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo">📚 LibraryOS</div>
        <div class="tagline">Management System</div>
    </div>

    <div class="nav-section">
        <div class="nav-label">Main</div>
        <a href="/" class="nav-link {% block nav_home %}{% endblock %}">
            <span class="icon">🏠</span> Dashboard
        </a>
        <a href="/members/" class="nav-link {% block nav_members %}{% endblock %}">
            <span class="icon">👥</span> Members
        </a>
        <a href="/books/" class="nav-link {% block nav_books %}{% endblock %}">
            <span class="icon">📖</span> Books
        </a>
        <a href="/devices/" class="nav-link {% block nav_devices %}{% endblock %}">
            <span class="icon">💻</span> Devices
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-label">Operations</div>
        <a href="/loans/" class="nav-link {% block nav_loans %}{% endblock %}">
            <span class="icon">🔄</span> Loans
        </a>
        <a href="/fines/" class="nav-link {% block nav_fines %}{% endblock %}">
            <span class="icon">💰</span> Fines
        </a>
        <a href="/events/" class="nav-link {% block nav_events %}{% endblock %}">
            <span class="icon">🎉</span> Events
        </a>
        <a href="/staff/" class="nav-link {% block nav_staff %}{% endblock %}">
            <span class="icon">🧑‍💼</span> Staff
        </a>
    </div>

    <div class="sidebar-footer">
        <a href="/admin/" class="nav-link">
            <span class="icon">⚙️</span> Admin Panel
        </a>
    </div>
</aside>

<div class="main">
    <div class="topbar">
        <div>
            <div class="page-title">{% block page_title %}Dashboard{% endblock %}</div>
            <div class="page-subtitle">{% block page_subtitle %}{% endblock %}</div>
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
